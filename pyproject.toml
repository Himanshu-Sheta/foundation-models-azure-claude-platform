[project]
name = "foundation-models-azure-claude-platform"
version = "1.0.0"
description = "Enterprise Foundation Model Orchestration & AI Development Platform powered by Anthropic Claude and Microsoft Azure AI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Himanshu Sheta", email = "himanshusheta2022@gmail.com" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
